# Starter subtitle-localization glossary for developer videos (EN -> zh-Hans + ja).
#
# This is a GENERIC seed: common developer/tooling vocabulary plus house style rules for
# Chinese and Japanese subtitles. Extend it with your own product names, brand renderings
# and domain terms (see glossary.example.yaml for the schema with a fictional brand).
#
# Retrieval: only terms whose `source`/alias appears in a segment are injected into the
# translation prompt. `enforce: hard` terms are also checked deterministically after
# translation; `enforce: soft` terms are a preference (their `avoid` forms are still
# auto-corrected, source-gated). See dev_titles/glossary.py.
#
# Optional: a sibling `termbase.yaml` (generated by dev_titles.termbase from a vendor
# term-base workbook) is merged in as SOFT long-tail guidance; this file wins on any
# shared source form.

version: 0.4
# Term-base rows NOT to load as terms: context-specific UI/email strings whose rendering is
# wrong as a general term (e.g. a salutation 'Hello' -> 尊敬的开发者，您好！).
termbase_exclude:
  - Hello
languages: [zh-Hans, ja]

# Do-not-translate (keep Latin in BOTH locales): product, framework, OS and tool names
# (React Native, TypeScript, VS Code, GitHub, Android, macOS, Node.js), initialisms (API,
# SDK, IDE, MCP, CLI), file names and code identifiers.

terms:
  # --- A. Frameworks / tools / platforms (DNT, hard) ---
  - source: "React Native"
    aliases: ["RN"]
    zh-Hans: "React Native"
    ja: "React Native"
    enforce: hard
    notes: "Framework name; DNT."
  - source: "TypeScript"
    zh-Hans: "TypeScript"
    ja: "TypeScript"
    enforce: hard
  - source: "Node.js"
    zh-Hans: "Node.js"
    ja: "Node.js"
    enforce: hard
  - source: "VS Code"
    aliases: ["Visual Studio Code"]
    zh-Hans: "VS Code"
    ja: "VS Code"
    enforce: hard
  - source: "VS Code extension"
    aliases: ["VS Code extensions"]
    zh-Hans: "VS Code扩展"
    ja: "VS Code拡張機能"
    enforce: hard
    notes: "Product name stays Latin; localize the descriptive 'extension'. No space between
      the Latin name and the CJK word."
  - source: "GitHub"
    zh-Hans: "GitHub"
    ja: "GitHub"
    enforce: hard
  - source: "Android"
    zh-Hans: "Android"
    ja: "Android"
    enforce: hard
    avoid:
      ja: ["android"]
      zh-Hans: ["android", "安卓"]
    notes: "Platform NAME — keep Latin, capitalized."
  - source: "macOS"
    aliases: ["Mac OS", "MacOS"]
    zh-Hans: "macOS"
    ja: "macOS"
    enforce: hard
    avoid:
      zh-Hans: ["麦金塔操作系统", "苹果操作系统"]
      ja: ["Macのオペレーティングシステム"]
    notes: "OS name — keep Latin. An encyclopedia lookup returns the classic-Mac-OS article
      title (麦金塔操作系统) for 'Mac OS'; never use it."
  - source: "Hello World"
    zh-Hans: "Hello World"
    ja: "Hello World"
    enforce: hard
    notes: "Canonical first-program identifier; DNT (keep Latin). In dev content it is never a
      literal greeting — expanding 'Hello' to a salutation produces critical garbles. Keep the
      phrase intact verbatim in both langs."
  - source: "API"
    zh-Hans: "API"
    ja: "API"
    enforce: hard
    notes: "DNT initialism."
  - source: "SDK"
    zh-Hans: "SDK"
    ja: "SDK"
    enforce: hard
  - source: "IDE"
    zh-Hans: "IDE"
    ja: "IDE"
    enforce: hard
  - source: "MCP"
    aliases: ["Model Context Protocol"]
    zh-Hans: "MCP"
    ja: "MCP"
    enforce: hard
    avoid:
      ja: ["Model Context Protocol"]   # name only — DON'T swallow a following サーバー
    notes: >-
      Keep the acronym MCP everywhere (MCPサーバー) — do NOT expand to 'Model Context
      Protocol' mid-video even when the source spells it out; the expansion reads as an
      MT inconsistency.

  # --- B. Core developer vocabulary ---
  - source: "app"
    zh-Hans: "应用"
    ja: "アプリ"
    enforce: hard
    notes: "Never 'application' for the noun. 'application' is NOT an alias — it also means
      'use/applications of X' (applications of AI -> 活用/用途), and the alias made enforce
      demand アプリ/应用 for that sense."
    avoid:
      zh-Hans: ["应用程序"]
      ja: ["アプリケーション"]
  - source: "developer"
    aliases: ["developers"]
    zh-Hans: "开发者"
    ja: "開発者"
    enforce: soft
    notes: "们 only for people and usually dropped: 开发者, not 开发者们."
  - source: "developer console"
    zh-Hans: "开发者控制台"
    ja: "開発者コンソール"
    enforce: soft
  - source: "Developer Portal"
    zh-Hans: "开发者门户"
    ja: "開発者ポータル"
    enforce: soft
  - source: "submit"
    aliases: ["submission"]
    zh-Hans: "提交"
    ja: "申請"
    enforce: hard
    notes: "Store submission split: zh 提交 (submit) vs ja 申請 (apply). Do not cross."
  - source: "upload"
    zh-Hans: "上传"
    ja: "アップロード"
    enforce: soft
  - source: "publish"
    zh-Hans: "发布"
    ja: "公開"
    enforce: soft
    notes: "Sense-dependent (see senses)."
    senses:
      - when: "release to a store / make publicly available"
        zh-Hans: "发布"
        ja: "公開"
      - when: "publish a package to a registry (npm publish)"
        zh-Hans: "发布"
        ja: "パブリッシュ"
  - source: "in-app purchasing"
    aliases: ["in-app purchase", "IAP"]
    zh-Hans: "应用内购买"
    ja: "アプリ内課金"
    enforce: soft
    notes: "ja uses 課金 (billing), not 購入. Keep '(IAP)' in parens on first use."
  - source: "screenshot"
    aliases: ["screenshots"]
    zh-Hans: "屏幕截图"
    ja: "スクリーンショット"
    enforce: soft
    avoid:
      zh-Hans: ["截屏"]
  - source: "release notes"
    zh-Hans: "发行说明"
    ja: "リリースノート"
    enforce: soft
    notes: "Pick ONE of 发行说明 / 发布说明 and keep it."
  - source: "performance"
    zh-Hans: "性能"
    ja: "パフォーマンス"
    enforce: soft
  - source: "accessibility"
    zh-Hans: "无障碍功能"
    ja: "アクセシビリティ"
    enforce: soft
  - source: "metrics"
    aliases: ["metric"]
    zh-Hans: "指标"
    ja: "指標"
    enforce: soft
    notes: "ja: established Japanese word over the katakana メトリクス."
  - source: "update"
    aliases: ["updates"]
    ja: "更新"
    enforce: soft
    notes: "ja: 更新 over アップデート. Product names containing 'Update' keep their own rendering."
  - source: "the web"
    aliases: ["web"]
    zh-Hans: "网页"
    ja: "ウェブ"
    enforce: soft
    notes: "The PLATFORM/medium sense only — 'Web' inside a product or API name (WebView,
      react-native-web) is DNT and protected by the identifier masking. zh reviewers write 网页
      (网页端 for 'on the web' as a platform), never Latin 'Web'."
  - source: "on-device"
    aliases: ["on device"]
    zh-Hans: "设备端"
    enforce: soft
    avoid:
      zh-Hans: ["端侧"]
    notes: "zh reviewers: 设备端 (incl. on-device AI -> 设备端AI), not 端侧."
  - source: "server-side"
    aliases: ["server side"]
    zh-Hans: "服务器端"
    enforce: soft
    avoid:
      zh-Hans: ["服务端"]
    notes: "e.g. server-side rendering -> 服务器端渲染."
  - source: "server function"
    aliases: ["server functions"]
    zh-Hans: "服务器函数"
    ja: "サーバー関数"
    enforce: soft
    avoid:
      zh-Hans: ["服务器功能"]
    notes: "A function that runs on the server — a code term, so 函数, not 功能 ('feature')."
  - source: "strongly typed"
    zh-Hans: "强类型"
    enforce: soft
    avoid:
      zh-Hans: ["重型"]
  - source: "schema"
    aliases: ["schemas"]
    zh-Hans: "schema"
    ja: "スキーマ"
    enforce: soft
    avoid:
      zh-Hans: ["方案"]
    notes: "Data / API schema. zh: Latin 'schema' (架构 / 模式 also seen); never 方案 ('plan')."
  - source: "hook"
    aliases: ["hooks", "React hook", "React hooks", "custom hook", "custom hooks"]
    zh-Hans: "Hook"
    ja: "フック"
    enforce: soft
    avoid:
      zh-Hans: ["挂钩"]
    notes: "React hooks. zh: the official Chinese React docs (zh-hans.react.dev) keep 'Hook' Latin, even
      for plurals; dev sites write Hooks, glossed 钩子. 挂钩 is the Win32 term and absent from React
      usage. Agent / Git hooks: 钩子 is fine."
  - source: "token"
    aliases: ["tokens", "LLM token", "LLM tokens", "AI tokens"]
    zh-Hans: "词元"
    enforce: soft
    avoid:
      zh-Hans: ["令牌"]
    notes: "AI / LLM sense only. China's national terminology committee (全国科学技术名词审定委员会,
      2026-03-25) designated 词元 the trial-use Chinese name for the AI term token. Authentication
      tokens (OAuth / API keys / JWT) stay 令牌."
  - source: "brownfield"
    aliases: ["Brownfield", "brownfield app", "brownfield apps"]
    zh-Hans: "Brownfield"
    ja: "Brownfield"
    enforce: soft
    avoid:
      zh-Hans: ["棕地"]
      ja: ["ブラウンフィールド"]
    notes: "Integrating React Native into an existing native app. Reviewers in both languages keep it Latin."
  - source: "React Foundation"
    aliases: ["the React Foundation"]
    zh-Hans: "React基金会"
    ja: "React Foundation"
    enforce: soft
    avoid:
      ja: ["React財団"]
    notes: "Official names on React's own sites: zh-hans.react.dev 'React 基金会', ja.react.dev 'React
      Foundation' (names policy: the organization's own localized name)."
  - source: "Linux Foundation"
    aliases: ["the Linux Foundation"]
    zh-Hans: "Linux基金会"
    ja: "Linux Foundation"
    enforce: soft
    notes: "zh-hans.react.dev 'Linux 基金会', ja.react.dev 'Linux Foundation'."
  - source: "footprint"
    aliases: ["app footprint", "the footprint of apps"]
    zh-Hans: "资源占用"
    enforce: soft
    notes: "An app's size / resource use — 资源占用, not 体量 (bulk)."
  - source: "use case"
    aliases: ["use cases"]
    ja: "用途"
    enforce: soft
    notes: "ja: 用途 / 活用例 over ユースケース."
  - source: "video"
    aliases: ["videos"]
    ja: "動画"
    enforce: soft
    notes: "ja: 動画 for a clip / recorded piece; 映像 for an on-screen picture / stream. Avoid
      ビデオ, but soft + no avoid-form: compounds like ビデオ通話 stay as they are."
  - source: "agent"
    aliases: ["agents"]
    zh-Hans: "智能体"
    ja: "エージェント"
    enforce: soft
    avoid:
      zh-Hans: ["代理", "助手"]
    notes: >-
      AI (coding) agent. zh 智能体: 代理 reads as "a substitute/proxy for a person" and 助手
      = "assistant" — both wrong nuance. (助手 is source-gated on 'agent' so 'assistant' ->
      助手 elsewhere is untouched.) Polysemous: a travel/booking/support 'agent' is a person —
      scope per video if the sense differs.
  - source: "agentic"
    zh-Hans: "智能体"
    enforce: soft
    avoid:
      zh-Hans: ["代理式", "代理"]
    notes: "Adjective form of agent ('agentic automation' -> 智能体自动化, NOT 代理式)."
  - source: "vibe coding"
    aliases: ["vibecoding", "vibe-coding", "vibe code", "vibecode"]
    zh-Hans: "vibe coding"
    ja: "バイブコーディング"
    enforce: hard
    notes: "ja: バイブコーディング (native reviewers' choice); zh keeps Latin."
  - source: "fork"
    zh-Hans: "分叉"
    ja: "フォーク"
    enforce: soft
    avoid:
      zh-Hans: ["分支"]
    notes: "Software fork (a derivative codebase), NOT 分支/branch. 'a fork of VS Code' ->
      VS Code的分叉版 (zh) / VS Codeのフォーク (ja)."
  - source: "observability"
    zh-Hans: "可观测性"
    ja: "オブザーバビリティ"
    enforce: soft
    avoid:
      ja: ["可観測性"]
    notes: "Pin ONE rendering so it doesn't flip across cues. ja standard = the loanword."
  - source: "Chief Evangelist"
    zh-Hans: "首席布道师"
    ja: "チーフエバンジェリスト"
    enforce: soft
    avoid:
      zh-Hans: ["首席宣讲师", "首席传道者", "首席福音传播者"]
    notes: "Tech-industry 'evangelist' = 布道师 (zh) / エバンジェリスト (ja), NOT 宣讲师/preacher."
  - source: "side-by-side"
    zh-Hans: "并排"
    ja: "横並び"
    enforce: soft
    notes: "Layout comparison; don't leave the English."
  - source: "stretch goal"
    aliases: ["stretch goals"]
    zh-Hans: "挑战性目标"
    ja: "ストレッチゴール"
    enforce: soft
    avoid:
      zh-Hans: ["进阶目标"]

  # --- C. React / React Native vocabulary (cross-video: render these the SAME way) ---
  - source: "concurrent rendering"
    aliases: ["concurrent render"]
    zh-Hans: "并发渲染"
    ja: "並列レンダリング"
    enforce: soft
    avoid:
      ja: ["同時レンダリング", "コンカレントレンダリング", "並行レンダリング"]
      zh-Hans: ["同时渲染", "并行渲染"]
    notes: >-
      ja = 並列レンダリング (native reviewer's choice): bare katakana コンカレント is opaque to a
      non-expert caption reader; 並列 is short and immediately understood.
  - source: "strict mode"
    aliases: ["StrictMode", "Strict Mode"]
    zh-Hans: "StrictMode"
    ja: "StrictMode"
    enforce: hard
    avoid:
      ja: ["厳格モード", "ストリクトモード", "Strictモード", "Strict Mode", "厳密モード"]
      zh-Hans: ["严格模式", "严格模型"]
    notes: "React API component <StrictMode> — DNT, keep as StrictMode."
  - source: "render"
    aliases: ["rendering", "renders", "rendered", "re-render", "rerender", "render pass", "render phase"]
    zh-Hans: "渲染"
    ja: "レンダリング"
    enforce: soft
    avoid:
      ja: ["レンダー", "描画"]
    notes: >-
      ja: レンダリング uniformly, NOT レンダー- or 描画. Substring-safe: レンダー→レンダリング
      fixes レンダー関数; レンダリング lacks レンダー so no double-correction.
  - source: "reconciliation"
    zh-Hans: "协调"
    ja: "調整"
    enforce: soft
    avoid:
      ja: ["リコンシリエーション"]
  - source: "props"
    aliases: ["prop"]
    zh-Hans: "属性"
    ja: "プロパティ"
    enforce: soft
    avoid:
      ja: ["props", "prop"]
    notes: "Localize consistently: never leave Latin 'props' mid-sentence."
  - source: "trace"
    aliases: ["tracing"]
    zh-Hans: "跟踪"
    ja: "トレース"
    enforce: soft
    avoid:
      zh-Hans: ["追踪"]
    notes: "One rendering per video: zh 跟踪 (never 追踪); ja トレース."
  - source: "bundle"
    aliases: ["bundled", "bundling"]
    zh-Hans: "Bundle"
    ja: "バンドル"
    enforce: soft
    avoid:
      zh-Hans: ["捆绑包", "捆绑"]
    notes: "zh keeps Latin 'Bundle' (JS Bundle); ja バンドル (NOT 同梱)."
  # --- D. TV focus / navigation (react-native-tvos) ---
  - source: "trap the focus"
    aliases: ["trapping the focus", "focus trapping", "trapping", "traps"]
    zh-Hans: "将焦点限制"
    ja: "フォーカスを固定"
    enforce: soft
    avoid:
      zh-Hans: ["焦点捕获", "捕获焦点"]
    notes: "'trap' here = confine, NOT capture."
  - source: "forward the focus"
    aliases: ["forward focus", "forwards the focus", "forwarding focus"]
    zh-Hans: "传递焦点"
    ja: "フォーカスの移動先"
    enforce: soft
    avoid:
      zh-Hans: ["转发焦点"]
    notes: "'forward' = pass/redirect focus, NOT network 'forward'."

style:
  ja:
    register: teineigo        # です・ます (敬体) throughout — never plain form
    # fixed_lines (exact-sentence renderings that bypass the model) are deliberately EMPTY: conversational
    # lines depend on who is speaking to whom; their renderings live in the context-aware notes. A fixed
    # line needs the reviewers' own finals to translate that exact line the same way >= 3x in >= 2 videos.
    # Interviews / conversations only (applied when the run is conversational, before `notes`).
    notes_conversational: >-
      SPOKEN REGISTER (interviews / conversations — overrides any presentation-register rule below):
      write the way people speak in a polite conversation, not a manual or a spec. Everyday verbs:
      使って (not 使用して), 選べます (not オプションを選択できます), 登録できます / 入れられます (not 入力できます
      for settings), 起動 for opening an app. Explanations and confirmations sound spoken: 〜んです /
      〜わけですね / 〜んですか. No stiff これは…を使って行っていました — say adbを使っていたんです. No redundant
      pairs (独自のカスタムコマンド -> 独自のコマンド). Spell terms out the way the speaker says them:
      オープンソースプロジェクト, never the abbreviation OSS.
      CLOSING THANKS: "So thanks for joining (today)" at the END of the conversation is past tense:
      本日はご参加いただきありがとうございました. It is ご参加 (they took part) — never ご出演 (appearing on
      a show). 御社 only where the guest's company as a business is meant; "the projects that you release"
      said to engineers needs no subject at all.
    notes: >-
      PUNCTUATION: write 、 and 。 normally — the normalizer converts 読点 、 to a half-width
      space and 句点 。 to a full-width space (the common Japanese subtitle convention). Omit
      ？ when the line is clearly a question (〜ですか) and omit ！ (unnatural in Japanese).
      Separate a Latin word from following Japanese with nothing (React Nativeを拡張 ✅).
      Keep 「」 for quotes, ・ for parallel nouns. Never place a space before a particle
      (は/が/を/に/で/と/へ/や/の/も). No 「」 around product names.
      REGISTER: です・ます consistently; use ご〜ください for reader-directed actions
      (ご活用ください); never end a sentence on a noun (体言止め). Product/brand names stay
      Latin; localize descriptive parts.
      KATAKANA vs JAPANESE WORDS: established IT katakana is fine (デバイス, アプリ, ランタイム),
      but where a common Japanese word exists, prefer it: 事業 (business), 技術 (technology),
      用途/活用例 (use case), 指標 (metrics), 更新 (update), ウェブ (the web), 動画 (video).
      vibe coding -> バイブコーディング.
      INTENSIFIERS: do not render every "really / very / super / so" — keep one only where the
      emphasis carries meaning.
      COMPANY "WE": when "we / our" means the speaker's company, use 当社 / 弊社, not 私達; the
      guest's company is 御社. Do NOT calque a possessive "our X" when it adds nothing (our
      documentation -> ドキュメント).
      NAMES: person names stay in Latin; add さん when addressing/referring to a guest or
      colleague (never to the speaker's own name); 氏 when cited in the third person. Job
      TITLES -> concise Japanese.
      KANJI: prefer kanji to hiragana for readability/brevity in subtitles (様々, 時, 予め, 曖昧,
      私達, 例えば).
      DISCOURSE FILLERS: OMIT interview filler that carries no content — "Yeah,", "So,",
      "Well,", "I mean", "you know" — do NOT render it as ええ / はい / そうですね / なるほど.
      Keep はい only when it genuinely answers a yes/no question.
      REPLIES: "Okay, okay." / "I see." taking in new information -> なるほど (わかりました sounds like
      accepting an instruction); "Sure." answering a question -> はい (もちろんです only when emphatic);
      a confirming question ends in 〜んですか. "Thanks for joining (us)" at a live event or interview ->
      ご参加…; ご視聴 only for "thanks for watching". KEEP hedges that change a claim (pretty much ->
      ほぼ, probably -> おそらく) and continuing action ("we've been running X since…" -> 〜してきました).
      NO ADDED MATERIAL: no ええ, no も ("also"), no explanation the English doesn't give.
      PRESENTATION REGISTER: "Today" -> 本日は (never casual 今日は); "I'll cover" -> ご紹介します;
      "support" -> サポートします (not 対応します); do NOT stack verbs with 中黒 as an MT-style
      compound (直接実行・デバッグできます); split long "do this, do that, and this" sentences;
      never repeat 向け within one sentence. Always ship the closing courtesy
      (ご視聴いただきありがとうございました). Never drop a measurement/number or a code
      identifier; never split a code identifier across a line/cue.
      MODIFIER STACKS: do not pile long pre-nominal modifiers onto one noun — break it into a
      short verbal sentence with an explicit subject.
      LINE BREAKS: communicate the CORE message, not every word; concise, ≤2 lines, break at
      意味のまとまり/文節 and apply kinsoku (no small kana / closing punctuation at a line start).
      UI labels: half-width brackets [ ] with a half-width space outside. Quotes 「」, nested 『』.
      NUMBERS: half-width arabic digits; ROUND LARGE counts in the myriad form (5万人, 100万米ドル,
      1,000億), other numbers with a comma thousands-separator (12,345); decimal point (1.5);
      arabic counters (1つ, 2つ). Be consistent across the video.
  zh-Hans:
    register: formal-written
    # Conversational/interview override (peer dialogue). Applied when the run is marked
    # conversational; prepended to the notes below.
    register_conversational: natural spoken register (peer conversation / interview), polite 您
    pronoun_conversational: >-
      PRONOUN (conversational): use 您 as the default singular second person, and 你们 for
      plural "you all" (您们 is unnatural — never use it). Native reviewers of published
      developer interviews changed a casual 你 to 您 essentially everywhere (only the plural
      你们 survived), so 您 is the house default — polite to the guest and the audience, not
      chummy. All other rules below (de-calque, pronoun economy, specificity, punctuation)
      still apply.
      CLOSING THANKS: "thanks for joining (today)" -> 感谢各位今天的参与 — not 能来 / 到场, which mean
      physical attendance. "Thanks for the invitation." -> 感谢邀请 (no 您的).
      GENERIC "YOU": when "you / your" means anyone or developers in general ("you can speed up
      logging in with adb", "package your app as a framework"), OMIT the pronoun —
      可以用adb命令加快登录应用的速度, 将应用打包为框架 — never 您可以 / 您的应用 for the generic you.
      您 is for talking TO a specific person (the guest, the host).
      SPOKEN REGISTER (interviews / chats): write the way people talk, not written Chinese — 聊 (talk
      about, not 讲), 有 ("we have", not 提供了 unless it really means provide), 好用 (a good tool), 还不少
      (plenty), 对 for a direct "Yes." answer (an interviewer's reflex "yeah" is still 嗯 / dropped);
      prefer short direct clauses to written connectors (借助…，可供…，以…方式). Casual asides stay
      casual.
    notes: >-
      REGISTER: formal written; address the reader as 您 consistently — NEVER 你.
      BACK-CHANNEL: an interviewer's reflex "Yeah / Right / Sure" is 嗯 (or dropped) — not
      对 / 是的 / 是啊. Tag questions keep the ？: "…, right?" -> "…，对吧？". AUDIENCE "you"
      (speaking to viewers) -> 大家; a video opener is 大家好 (never 您好). Prefer 很 to 非常 for
      ordinary emphasis.
      PRONOUN ECONOMY: use 您 sparingly (as subject only); avoid 您的+object and never
      为您提供 — Chinese drops obvious pronouns (it/they/we/our too). "as you can see" ->
      可以看到, never 如您所见.
      SPECIFICITY: viewers see one cue at a time, so resolve antecedents to the named thing
      (React Native核心 over Core, 全部工具 over 一切) — BUT don't re-name what the previous line just
      named ("With this, you can quickly get them open" after a line about the simulators ->
      用这个就能快速将它们打开). NO ADDED MATERIAL: nothing the English doesn't say.
      PUNCTUATION: no 。 (the cue/line break ends the sentence; a mid-line sentence break is a
      single space); use ， between clauses of one sentence (~2 per 100 chars) so long cues
      don't read as run-ons. No punctuation at a line END except ？, quotes and brackets.
      Full-width punctuation （）“”，：、 with no inter-word spaces; quotes “”, nested ‘’;
      ellipsis U+2026. No space between Chinese and adjacent Latin (React Native是… not
      React Native 是…).
      UI LABELS the user clicks: keep the Latin label and gloss the Chinese in parens — More
      Actions（更多操作）. Inline code, identifiers, file/dir names and strings the speaker types
      stay verbatim Latin. Acronyms glossed on first use then used alone: 文本转语音（TTS）.
      CONSISTENCY: ONE rendering per concept for the whole video (trace 跟踪 not 追踪).
      Collapse the speaker's stutters and self-repairs.
      DE-CALQUE (anti-翻译腔 / 欧化中文): translate MEANING into natural Chinese, not English
      structure. Don't chain 的-modifiers; drop 是...的 around a bare adjective; avoid 被
      passive overuse; use plain verbs, not 进行/作出/给予+noun; drop 一个/一种 for English a/an;
      avoid reflexive 当…的时候; skip the hedge 之一; 们 only for people; prefer a verb/adjective
      over -性/-度/-化 nominalization (except established terms like 可扩展性); don't calque
      关于/对于; parataxis over English connectors; topic-first word order; split a long
      relative-clause modifier into a short verbal sentence.
      LINE BREAKS: communicate the CORE message, not every word; ≤2 lines; apply kinsoku
      (no closing punctuation at a line start). Person NAMES stay in Latin except widely-known
      Chinese names; job TITLES -> concise Chinese.
      NUMBERS: ROUND LARGE counts in the myriad form (13万, 1350万, 500亿); other numbers arabic
      with a comma thousands-separator (12,345) and a decimal point (1.5); NO space between a
      number and Chinese characters. Be consistent across the video.

heuristics: >-
  General rule: for non-branded generic tech/UI nouns, zh-Hans TRANSLATES to Hanzi
  (设备筛选, 通用搜索, 启动器, 投屏) while ja often TRANSLITERATES to katakana
  (フィルタリング, ユニバーサル検索, ランチャー, キャスト). Product/brand/OS/SDK/service names
  stay Latin in BOTH. LOCALIZE descriptive/common-noun parts even inside product names:
  Developer Tools->开发者工具/開発者ツール, Core->核心/コア, Developer Portal->开发者门户/
  開発者ポータル, runtime->运行时/ランタイム, library->库/ライブラリ, architecture->架构/
  アーキテクチャ, business logic->业务逻辑/ビジネスロジック. Keep ONLY the genuine proper name
  Latin and localize around it (e.g. "React Native Core"->React Native核心). Truly-Latin-in-
  both: React Native, TypeScript, VS Code, Chrome DevTools, GitHub, API, SDK.

