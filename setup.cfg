# Packaging metadata lives in pyproject.toml; this file only configures tools.

[tool:pytest]
xfail_strict = true
addopts =
    --verbose
    # show the slowest 5 tests at the end
    --durations=5
testpaths = test
looponfailroots = src test
# Coverage (needs pytest-cov, included in the [dev] extra):
#   pytest --cov dev_titles --cov-report term-missing

[coverage:run]
branch = true
source = dev_titles

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage/coverage.xml

[flake8]
ignore =
    # Not pep8, black adds whitespace before ':'
    E203,
    # Not pep8, black adds line break before binary operator
    W503,
    # black handles line length; the remaining long lines do not matter.
    E501,
    # black leaves tight arithmetic (a*b) — don't fight the formatter.
    E226,
max_line_length = 100
