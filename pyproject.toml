[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-titles"
version = "0.2.2"
description = "Deterministic subtitle-localization harness: local EN ASR, glossary-aware LLM translation to zh-Hans/ja, CJK re-segmentation, validation and QE. Python import module: dev_titles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Moses Roth", email = "mosesroth@gmail.com" }]
keywords = ["subtitles", "captions", "localization", "translation", "cjk", "asr", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",  # TOML reader on 3.10 (tomllib is 3.11+)
]

[project.optional-dependencies]
tmx = ["defusedxml>=0.7"]                            # TMX translation-memory import (hardened XML parser)
cjk = ["fugashi[unidic-lite]>=1.3", "jieba>=0.42"]  # word-safe CJK line-breaking
whisper = ["whisperx>=3.1"]                          # local ASR (needs ffmpeg on PATH)
parakeet = ["parakeet-mlx"]                          # fast local ASR (Apple Silicon / MLX only)
assemblyai = ["requests>=2.31"]                      # AssemblyAI cloud ASR ($ASSEMBLYAI_API_KEY)
api = ["anthropic>=0.40"]                            # Claude via the first-party Anthropic API
bedrock = ["anthropic[bedrock]>=1.2", "openai>=1.0"]  # Claude (+ GPT judge) on AWS Bedrock (optional)
aws = ["boto3>=1.34"]
youtube = ["yt-dlp", "google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]  # URL input + caption publishing
xlsx = ["openpyxl>=3.1"]                             # .xlsx term-base import + audit report
qe = ["unbabel-comet>=2.2"]                          # optional CometKiwi QE (gated HF model: accept license + hf auth login)
search = ["ddgs>=6.0"]  # DuckDuckGo fallback for auto doc-grounding (Google CSE needs no dep)
# lint tools pinned: the pre-push gate and CI must format and check identically
dev = ["pytest>=8.0", "bandit==1.9.4", "defusedxml>=0.7", "pytest-cov", "black==26.10.1", "isort==9.0.2", "flake8==7.4.1", "mypy==2.4.0"]

[project.scripts]
dev-titles = "dev_titles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test"]

[tool.setuptools.package-data]
dev_titles = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
known_first_party = ["dev_titles"]

# required for compatibility with black:
profile = "black"

# To maintain consistency with other settings
line_length = 100

[tool.mypy]
# See https://mypy.readthedocs.io/en/latest/config_file.html for more mypy options.

# Enables the type-checker on the interior of functions without type annotations.
check_untyped_defs = true

# Displaying specific error codes makes it easier to silence specific errors
# See also https://mypy.readthedocs.io/en/latest/error_codes.html
show_error_codes = true

# Show source code snippets and location markers in error messages
pretty = true

# Suppresses errors about packages which do not implement type-hint sharing.
# See also https://mypy.readthedocs.io/en/latest/running_mypy.html#missing-imports.
ignore_missing_imports = true
