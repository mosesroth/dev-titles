name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cjk,xlsx]"
      - name: Format (black, isort)
        run: |
          black --check src scripts test
          isort --check-only src scripts test
      - name: Lint (flake8)
        run: flake8 src scripts test
      - name: Types (mypy)
        run: mypy src/dev_titles
      - name: Security scan (bandit, medium+)
        run: bandit -q -r src scripts -ll
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -o addopts="" test
